toml
[package]
name = "AuroraOS"
version = "0.1.0"
edition = "2021"
[dependencies]
rustc_version = "0.4.0"
x86_64 = "0.14.10"
spin = "0.9.2"
volatile = "0.4.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
actix-web = "4.2.1"
ndarray = "0.15.3"
[profile.release]
opt-level = 3
debug = false
[target.'cfg(target_arch = "x86_64")'.dependencies]
bootloader = "0.9.24"